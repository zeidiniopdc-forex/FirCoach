name: Build Android App Bundle (AAB)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  build-aab:
    name: Build Android App Bundle
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init FitForge com.fitforge.app --web-dir=dist

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks

      - name: Create keystore.properties
        if: env.KEYSTORE_PASSWORD != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/keystore.properties << EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=app/release-keystore.jks
          EOF

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build Signed AAB
        if: env.KEYSTORE_PASSWORD != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Build Unsigned AAB (fallback)
        if: env.KEYSTORE_PASSWORD == ''
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Get version from tag
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=${{ github.event.inputs.version }}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Rename AAB file
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          mkdir -p release-aab
          if [ -f "android/app/build/outputs/bundle/release/app-release.aab" ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab release-aab/fitforge-${VERSION}.aab
          elif [ -f "android/app/build/outputs/bundle/release/app-release-unsigned.aab" ]; then
            cp android/app/build/outputs/bundle/release/app-release-unsigned.aab release-aab/fitforge-${VERSION}-unsigned.aab
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitforge-aab-${{ steps.get_version.outputs.VERSION }}
          path: release-aab/
          retention-days: 90

      - name: Upload to Google Play (if configured)
        if: env.SERVICE_ACCOUNT_JSON != ''
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.fitforge.app
          releaseFiles: release-aab/*.aab
          track: internal
          status: draft

      - name: Build Summary
        run: |
          echo "## 📦 Android App Bundle Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.get_version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Format:** AAB (Android App Bundle)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Status" >> $GITHUB_STEP_SUMMARY
          echo "✅ Web app built" >> $GITHUB_STEP_SUMMARY
          echo "✅ Capacitor synced" >> $GITHUB_STEP_SUMMARY
          echo "✅ AAB generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### AAB File" >> $GITHUB_STEP_SUMMARY
          ls -lh release-aab/ | awk '{printf "- %s (%s)\n", $9, $5}' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** AAB format is required for Google Play Store uploads" >> $GITHUB_STEP_SUMMARY
