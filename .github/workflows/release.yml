name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Create archive
        run: |
          tar -czf fitforge-${{ github.ref_name }}.tar.gz dist/
          zip -r fitforge-${{ github.ref_name }}.zip dist/
      - name: Generate changelog
        id: changelog
        run: |
          echo "## What's Changed" > changelog.md
          git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:"- %s" >> changelog.md
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            fitforge-${{ github.ref_name }}.tar.gz
            fitforge-${{ github.ref_name }}.zip
          body_path: changelog.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
